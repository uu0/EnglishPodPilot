# 云端自动构建并推送到 Docker Hub
# 触发：push 到 main（忽略纯文档/模板改动），也可在 GitHub Actions 页面手动触发
# 前置：仓库 Settings → Secrets and variables → Actions 添加两个 secret：
#   DOCKERHUB_USERNAME  = 你的 Docker Hub 用户名
#   DOCKERHUB_TOKEN     = Docker Hub → Account Settings → Personal Access Tokens 生成的 token
name: build-push-docker-hub

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
      - 'template/**'
      - 'test/**'
      - 'local/**'
      - '.gitignore'
      - '.dockerignore'
  workflow_dispatch: # 允许手动触发

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/englishpod-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/englishpod-web:${{ github.sha }}
