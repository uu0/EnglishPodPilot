<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EnglishPodPilot</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- ============ 视图：正在播放（播放器 + 正文） ============ -->
<section class="view active" id="view-now">
  <button class="icon-btn menu-btn now-menu-btn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  <div class="now-player">
    <div class="np-top">
      <div class="np-meta">
        <span class="level" id="nowLevel" style="display:none">—</span>
        <h2 id="nowTitle">还没有在播的课程</h2>
        <p id="nowEn">从课程页选一节开始</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-left:auto">
        <div class="toggle-wrap">
          译文
          <button class="switch" id="zhToggle" aria-label="显示译文"></button>
        </div>
      </div>
    </div>
    <div class="now-progress-track" id="nowSeek"><div id="nowProgressFill"></div></div>
    <div class="now-time"><span id="nowElapsed">0:00</span><span id="nowDuration">0:00</span></div>
    <div class="now-controls">
      <button class="now-btn small" id="nowRepeat" aria-label="循环模式"></button>
      <button class="now-btn" id="nowPrev" aria-label="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM18 6l-8.5 6L18 18z"/></svg></button>
      <button class="now-btn main" id="nowPlay" aria-label="播放/暂停"></button>
      <button class="now-btn" id="nowNext" aria-label="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg></button>
      <span class="now-btn-spacer" aria-hidden="true"></span>
    </div>
  </div>
  <div class="now-transcript" id="nowTranscript"></div>
  <div class="upnext">
    <h3>接下来播放</h3>
    <div id="upnextList"></div>
  </div>
</section>

<!-- ============ 视图：课程 ============ -->
<section class="view" id="view-home">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>English<span>Pod</span> 课程</h1>
        <p><span id="lessonCountTxt">加载中…</span> · 点卡片直接开播</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn menu-btn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
        <button class="icon-btn" id="searchToggle" aria-label="搜索">⌕</button>
      </div>
    </div>
    <div class="search-expand" id="searchExpand">
      <div class="search">
        <span class="icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索课程标题、话题…" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="status-filter" id="statusFilter">
    <button class="chip active" data-status="all">全部</button>
    <button class="chip" data-status="unplayed">未播</button>
    <button class="chip" data-status="played">已播</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip active" data-series="all">全系列</button>
    <button class="chip" data-series="standard">标准课程</button>
    <button class="chip" data-series="DC">DC 系列</button>
    <button class="chip" data-series="TJI">TJI 系列</button>
  </div>
  <div class="lesson-list" id="lessonList"></div>
</section>

<!-- ============ 视图：生词本 ============ -->
<section class="view" id="view-vocab">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>生词本</h1>
        <p id="vocabSub">点词保存，随时回来复习</p>
      </div>
      <button class="icon-btn menu-btn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    </div>
  </div>
  <div class="vocab-list" id="vocabList"></div>
</section>

<!-- ============ 视图：统计 ============ -->
<section class="view" id="view-stats">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1>统计</h1>
        <p>播放记录与学习数据</p>
      </div>
      <button class="icon-btn menu-btn" aria-label="菜单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat"><b class="accent" id="stPlays">0</b><span>累计播放</span></div>
    <div class="stat"><b id="stDone">0</b><span>播完课程</span></div>
    <div class="stat"><b id="stMinutes">0</b><span>学习分钟</span></div>
    <div class="stat"><b id="stWords">0</b><span>收藏生词</span></div>
  </div>
  <div class="stat-section">
    <h3>播放排行</h3>
    <div id="rankList"></div>
  </div>
  <div class="stat-section">
    <h3>最近播放</h3>
  </div>
  <div class="history-wrap" id="historyList"></div>
</section>

<!-- ============ 视图：我的 ============ -->
<section class="view" id="view-me">
  <div class="me-head">
    <div class="avatar">S</div>
    <div>
      <h2>学习者</h2>
      <p>已坚持学习 13 天 · 继续保持</p>
    </div>
    <button class="icon-btn menu-btn" aria-label="菜单" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
  </div>
  <div class="me-stats">
    <div class="stat"><b id="statLessons">0</b><span>播完课程</span></div>
    <div class="stat"><b id="statWords">0</b><span>收藏生词</span></div>
    <div class="stat"><b id="statTotal">–</b><span>全部课程</span></div>
  </div>
  <div class="me-wrap">
    <div id="authArea"></div>
  </div>
</section>

<audio id="audio" preload="metadata"></audio>

<!-- ============ 常驻播放条（Apple Music 式，播放页隐藏） ============ -->
<div class="mini-player idle hidden" id="miniPlayer">
  <div class="mp-row">
    <div class="mp-transport">
      <button class="mp-btn" id="mpPrev" aria-label="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM18 6l-8.5 6L18 18z"/></svg></button>
      <button class="mp-btn main" id="mpPlay" aria-label="播放/暂停"></button>
      <button class="mp-btn" id="mpNext" aria-label="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg></button>
    </div>
    <div class="mp-info" id="mpInfo">
      <div class="mp-title" id="mpTitle">未在播放</div>
      <div class="mp-sub" id="mpSub">去"播放"页选一节课</div>
    </div>
    <div class="mp-quick">
      <button class="mp-qbtn" id="mpLang" title="中英文切换">中/英</button>
      <button class="mp-qbtn" id="mpTimer" title="定时"></button>
      <button class="mp-qbtn" id="mpRepeat" title="循环"></button>
      <button class="mp-qbtn" id="mpQueue" title="接下来播放"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    </div>
  </div>
  <div class="mp-progress"><div id="mpProgressFill"></div></div>
</div>

<!-- ============ 接下来播放弹层 ============ -->
<div class="sheet-mask" id="queueMask"></div>
<div class="queue-sheet" id="queueSheet">
  <div class="sheet-handle"></div>
  <h3>接下来播放</h3>
  <div id="queueList"></div>
</div>

<!-- ============ 移动端导航下拉菜单 ============ -->
<div class="menu-dropdown" id="menuDropdown">
  <button class="menu-item-nav active" data-view="view-now"><span>▶</span>播放</button>
  <button class="menu-item-nav" data-view="view-home"><span>📚</span>课程</button>
  <button class="menu-item-nav" data-view="view-vocab"><span>🔖</span>生词<span class="count-badge" id="vocabBadgeMenu" style="display:none">0</span></button>
  <button class="menu-item-nav" data-view="view-stats"><span>📊</span>统计</button>
  <button class="menu-item-nav" data-view="view-me"><span>👤</span>我的</button>
</div>

<!-- ============ 底部导航（已停用，移动端改用汉堡菜单） ============ -->
<nav class="tabbar" id="tabbar">
  <button class="tab active" data-view="view-now"><span class="ticon">▶</span>播放</button>
  <button class="tab" data-view="view-home"><span class="ticon">📚</span>课程</button>
  <button class="tab" data-view="view-vocab"><span class="ticon">🔖</span>生词<span class="count-badge" id="vocabBadge" style="display:none">0</span></button>
  <button class="tab" data-view="view-stats"><span class="ticon">📊</span>统计</button>
  <button class="tab" data-view="view-me"><span class="ticon">👤</span>我的</button>
</nav>

<!-- ============ 侧边栏（桌面端） ============ -->
<aside class="sidebar" id="sidebar">
  <div class="side-head">
    <button class="side-collapse" id="sideCollapse" aria-label="收起侧边栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
    <div class="side-logo">English<span>Pod</span>Pilot</div>
  </div>
  <div class="side-sub"><span id="lessonCountSide">–</span> 节课程 · 沉浸式阅读</div>
  <button class="side-tab active" data-view="view-now"><span>▶</span>正在播放</button>
  <button class="side-tab" data-view="view-home"><span>📚</span>课程</button>
  <button class="side-tab" data-view="view-vocab"><span>🔖</span>生词<span class="count-badge" id="vocabBadgeSide" style="display:none">0</span></button>
  <button class="side-tab" data-view="view-stats"><span>📊</span>统计</button>
  <button class="side-tab" data-view="view-me"><span>👤</span>我的</button>
  <div class="side-foot">EnglishPodPilot · 桌面版</div>
</aside>
<button class="side-expand" id="sideExpand" aria-label="展开侧边栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>

<!-- ============ 查词弹层 ============ -->
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="word" id="sheetWord">—</div>
  <div class="phonetic" id="sheetPhonetic">—</div>
  <div id="sheetDefs"></div>
  <div class="example" id="sheetExample" style="display:none"></div>
  <button class="save-word-btn" id="saveWordBtn">＋ 加入生词本</button>
</div>
<script src="app.js"></script>
</body>
</html>
